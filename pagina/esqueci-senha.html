<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha - Clube do Caramelo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../imagens/patinha.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../estilo/style.css">
  </head>
  <body>
    <header class="topo">
      <a class="logo" href="../index.html"><img class="logo-icone" src="../imagens/patinha.svg" alt="Logo do Clube do Caramelo"><span>Clube do Caramelo</span></a>
      <a href="../index.html">← Voltar ao início</a>
    </header>
    <main>
      <section class="centro texto-centro">
        <h1>Esqueceu a senha?</h1>
        <p class="sub">Digite seu e-mail e enviaremos um<br>link para criar uma nova senha.</p>
        <form class="caixa" action="entrar.html">
          <label>
            E-mail da conta
            <input type="email" required placeholder="seu@email.com">
          </label>
          <button class="botao bloco" type="submit">Enviar link de recuperação</button>
        </form>
        <div class="caixa-verde texto-esquerda">
          <h3>Não recebeu o e-mail?</h3>
          <p>Confira a caixa de spam e espere alguns<br>minutos antes de pedir outro link.</p>
        </div>
        <p><a class="limpar" href="entrar.html">← Voltar para o login</a></p>
      </section>
    </main>
  </body>
</html>
